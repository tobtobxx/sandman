[package]
name = "sandman"
version = "4.1.0"
edition = "2024"
description = "An agent swarm that coordinates through a shared queue"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
async-trait = "0.1"
thiserror = "2.0.20"
axum = { version = "0.7", features = ["ws"] }
rust-embed = { version = "8", features = ["debug-embed"] }
futures-util = "0.3"
tempfile = "3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
num_enum = "0.7.6"
toml = "1.1.4"
matrix-sdk = { version = "0.18", features = ["markdown", "sqlite", "e2e-encryption"] }
croner = { version = "4.0.0", features = ["chrono"] }

[dev-dependencies]
tokio-tungstenite = "0.24"


[lib]
name = "sandman"
path = "src/lib.rs"
