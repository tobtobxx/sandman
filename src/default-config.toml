# Sandman's configuration.
#
# Written here when Sandman starts and finds nothing, and then Sandman stops:
# there is nothing sensible to run before you have read this file. Nothing has a
# built-in fallback — what is here is what Sandman uses, and a key that is not
# here is an error at start. An unknown key is an error too, so a typo is loud
# rather than quiet.
#
# Read from --config, else $XDG_CONFIG_HOME/sandman/config.toml.
#
# Any string may name an environment variable: `$NAME` or `${NAME}`, and `$$`
# for a literal `$`. A variable that is not set is an error, not an empty
# string.


# --- Models ------------------------------------------------------------------
# One table per slug. The name in brackets is the slug, and everything below
# names a model by it. Slugs nothing names are kept, not complained about.
#
#   endpoint  a chat-completions URL
#   api_key   sent as `Authorization: Bearer`. May be empty for a local endpoint.
#   model     what that endpoint calls the model
#   effort    how much the model may think before it answers. `false` asks for no
#             reasoning at all. Anything else is a string, sent as written —
#             "low", "medium", "high", or whatever else the endpoint takes.

[model.qwen36-local]
endpoint = "https://llm.tobtobxx.net/v1/chat/completions"
api_key = ""
model = "Qwen3.6-35B-A3B:MXFP4_MOE"
effort = false

[model.qwen36-remote]
endpoint = "https://openrouter.ai/api/v1/chat/completions"
# A prototype key with a low limit; leaking it costs nothing.
api_key = "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"
model = "qwen/qwen3.6-35b-a3b"
effort = false

[model.glm-flash]
endpoint = "https://openrouter.ai/api/v1/chat/completions"
api_key = "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"
model = "z-ai/glm-5.3-flash"
# This one refuses to have reasoning turned off — HTTP 400, "Reasoning is
# mandatory for this endpoint". "low" is the least it takes.
effort = "low"


# --- Which model does which work ---------------------------------------------
# `all` is what every Session uses. The rest are the only optional keys in this
# file: each names the model for that Role's Workers, and falls back to `all`
# when it is not here. `comms` is the Session that talks to a human.

[models]
all = "qwen36-local"
# comms = "qwen36-remote"
# planning = "qwen36-remote"
# research = "qwen36-remote"
# memory = "qwen36-local"
# task_manager = "qwen36-local"


# --- Sandman -----------------------------------------------------------------

[sandman]
# A relative path is relative to the working directory. The parent of each is
# created at start if it is not there.
sqlite_path = "$XDG_STATE_HOME/sandman/sandman.sqlite"
log_path = "$XDG_STATE_HOME/sandman/sandman.log"
# Where the control socket lives — how `sandman task`, `sandman list` and
# `sandman spend` reach a Sandman that is already running.
control_socket = "$XDG_RUNTIME_DIR/sandman/sandman.sock"
webui_address = "::1"
webui_port = 8080


# --- Metacognition -----------------------------------------------------------

[metacognition]
# How many messages may pass with no review and no interrupt before one fires.
interrupt_interval = 15
model = "qwen36-local"


# --- Embedding ---------------------------------------------------------------
# What the `memory` Role searches with. Not a chat model: its own endpoint, and
# nothing to think about. Cached vectors are keyed on the model name, so
# changing it leaves the old ones alone rather than mixing two vector spaces.

[embedding]
endpoint = "https://openrouter.ai/api/v1/embeddings"
api_key = "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"
model = "liquid/lfm-2.5-embedding-350m:free"
# Longer inputs cost more and embed worse. The cap is here so one runaway Brief
# cannot fail a whole batch.
max_input_chars = 6000


# --- Channels ----------------------------------------------------------------
# The ways a human reaches the swarm. The Watcher UI is served either way; `web`
# only decides whether its chat pane is a Channel or says it is turned off.

[channels]
# The terminal. Turned off, the trace goes to stdout as well as to the log,
# because nothing else is using it.
stdio = true
web = true


# --- Tools -------------------------------------------------------------------

[tools]
# What `web_search` asks.
searxng_endpoint = "https://searxh.tobtobxx.net/"


# --- Bench -------------------------------------------------------------------

[bench]
# The grader's model. Deliberately stronger than the swarm's: a judge no better
# than what it judges is not a judge. What it costs is never Spend.
grader = "glm-flash"
